name: react

on:
  push:
    paths:
      - 'react/**'
      - '.github/workflows/react.yml'
  pull_request:
    paths:
      - 'react/**'
      - '.github/workflows/react.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        react: ['18', '19']
    name: Node ${{ matrix.node }} - React ${{ matrix.react }}
    defaults:
      run:
        working-directory: react
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The dev toolchain pins React 18; swap in the peer version under test.
      - name: Install React ${{ matrix.react }}
        if: matrix.react != '18'
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
